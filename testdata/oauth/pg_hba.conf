# pg_hba.conf for the Postgres 18 test server: the image's defaults, plus OAuth for the role qg_oauth.
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
local replication all trust
host replication all 127.0.0.1/32 trust
host all qg_oauth all oauth issuer="https://issuer.queryguard.test" scope="openid"
host all all all scram-sha-256
