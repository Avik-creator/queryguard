name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Latest 1.27 patch release; go.mod's "go 1.27.0" is only the minimum.
          go-version: "1.27.x"
          # Caches downloaded modules and compiled packages. The key changes
          # when either file changes. go.sum appears with the first dependency.
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: make vet
      - run: make test

  postgres:
    name: Postgres ${{ matrix.pg }}
    runs-on: ubuntu-latest
    # PG19 is in beta, so its failures show without failing the run.
    continue-on-error: ${{ matrix.pg == 19 }}
    strategy:
      # Keep testing the other versions when one fails.
      fail-fast: false
      matrix:
        pg: [16, 17, 18, 19]
    env:
      # A small data set so the load takes seconds, not minutes.
      QG_CUSTOMERS: 10000
      QG_ORDERS: 100000
    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres ${{ matrix.pg }}
        run: docker compose up -d --wait pg${{ matrix.pg }}

      - name: Check the data loaded
        run: |
          orders=$(docker compose exec -T pg${{ matrix.pg }} \
            psql -U postgres -d queryguard -Atc "select count(*) from orders")
          echo "orders: $orders"
          test "$orders" = "$QG_ORDERS"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run clients through the proxy
        run: make compat PG=${{ matrix.pg }}

      - name: Show Postgres logs
        if: failure()
        run: docker compose logs pg${{ matrix.pg }}

  rogue:
    name: Rogue benchmark p99 gate
    # Compares the pull request with its base on one runner, since runners differ more than a regression worth catching.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The full data set: the rogue tenant's budget is sized against a full read of the 10M-row orders table.
      - name: Start Postgres 18
        run: docker compose up -d --wait pg18

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run the benchmark on the base
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          cd ../base
          # The base may miss its own targets or predate QG_ROGUE_OUT; the head is judged only against numbers it wrote.
          QG_ROGUE=1 QG_ROGUE_OUT=$RUNNER_TEMP/base.json QG_TEST_UPSTREAM=127.0.0.1:5418 \
            go test -run TestRogueTenant -count 1 -v -timeout 10m ./test/compat/ || true

      - name: Run the benchmark on the pull request
        run: QG_ROGUE=1 QG_ROGUE_BASE=$RUNNER_TEMP/base.json QG_TEST_UPSTREAM=127.0.0.1:5418 go test -run TestRogueTenant -count 1 -v -timeout 10m ./test/compat/
